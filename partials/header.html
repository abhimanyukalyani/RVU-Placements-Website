     =========================================================================== -->

    <a class="site-mark" href="index.html">

           crest is aria-hidden and contributes no duplicate label. Inlined

           enters the palette (CLAUDE.md §A). -->
      <span class="site-mark__crest" aria-hidden="true"><svg class="crest" viewBox="-0.50 -0.52 82.36 85.59" fill="currentColor" aria-hidden="true" focusable="false"><use href="#rvu-crest"/></svg></span>

        <span class="site-mark__name">RV University</span>
        <span class="site-mark__section">Placements</span>
